<div class="generic-buttons"
        th:fragment = "generic-buttons(
                        showAction1, action1Text,
                        showAction2, action2Text,
                        showAction3, action3Text,
                        showAction4, action4Text)">
        
        <button th:if="${showAction1}" type="action1"
                                        class="btn btn-action-1"
                                        id="action1"
                                        th:text="${action1Text}">
        </button>

        <button th:if="${showAction2}" type="button"
                                        class="btn btn-action-2"
                                        id="action2"
                                        th:text="${action2Text}">
        </button>

        <button th:if="${showAction3}" type="button"
                                        class="btn btn-cancel"
                                        id="action3"
                                        th:text="${action3Text}">
        </button>

        <button th:if="${showAction4}" type="button"
                                        class="btn btn-danger"
                                        id="action4"
                                        th:text="${action4Text}">
        </button>

</div>
