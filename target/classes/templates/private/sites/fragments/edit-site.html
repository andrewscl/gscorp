<div class="site-dual-panel-card">
    <input type="hidden" id="siteId" th:value="${site.id}" />

  <div class="panel-container">
    <div class="panel-main">

      <div class="panel-header">
        <h4>Editar Sitio</h4>
      </div>

      <div id="panel-body" class="panel-body">
        <div class="form-group">
          <label>Proyecto</label>
          <span class="readonly-field"
            th:text="${site.project != null ? site.project.name : '—'}"></span>
          <input type="hidden" name="projectId"
            th:value="${site.project != null ? site.project.id : ''}" />
        </div>

        <hr class="form-separator"/>

        <div class="form-row w-custom">
          <div class="form-group fx-3">
            <label>Nombre</label>
            <input id="siteName" name="name" type="text"
                  th:value="${site.name}" required />
          </div>
          <div class="form-group fx-7">
            <label">Dirección</label>
            <input id="siteAddress" name="address" type="text"
                  th:value="${site.address}" placeholder="Calle 123, Comuna" />
          </div>
        </div>

        <div class="site-zones-table">
            <div class="title-row">
              <div class="title-left">
                <span class="title-text">Zonas</span>
              </div>
              <button class="btn btn-primary" id="viewSitesMapBtn">
              Ver mapa
              </button>
            </div>
            <div class="site-zones-list">
              <table class="table">
                <thead>
                  <tr>
                    <th>Zona</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody id="site-zone-tbody">
                </tbody>
              </table>
            </div>
        </div>

      </div>
    </div>

    <div class="panel-aside">
      <div class="panel-aside-content">
        <h3>Ubicación</h3>
        <div class="content" id="map"></div>
      </div>
    </div>
  </div>

    <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>

    <div th:replace="~{shared/fragments/footer-buttons ::
                        footer-buttons(
                            true, 'Actualizar sitio',
                            true, 'Cancelar',
                            true, 'Eliminar sitio')}"></div>
</div>

  <script type="module" src="/js/private/sites/edit-site.js"></script>
