<div id="editProjectContainer" class="edit-project-container">

  <div class="hs-form-header">
    <h3>Editar Proyecto</h3>
  </div>

    <div class="form-group">
      <label>Cliente</label>
      <span class="readonly-field"
        th:text="${clientName != null ? clientName : '—'}"></span>
      <small>Un proyecto pertenece a un único cliente.</small>
    </div>

    <hr class="form-separator"/>

    <div class="form-group">
      <label>Nombre</label>
      <input id="projectName" type="text"
             th:value="${name}" required />
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <input id="projectDescription" type="text"
             th:value="${description}" placeholder="Descripción del proyecto"/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Fecha inicio</label>
        <input id="projectStartDate" type="date"
               th:value="${startDate}" required/>
      </div>
      <div class="form-group">
        <label>Fecha término</label>
        <input id="projectEndDate" type="date"
               th:value="${endDate}"/>
      </div>
    </div>

    <div class="form-group active-row">
      <input id="projectActive" type="checkbox"
             th:checked="${active}"/>
      <label style="margin:0">Activo</label>
    </div>



  <script type="module" src="/js/private/projects/edit-project.js"></script>

</div>
