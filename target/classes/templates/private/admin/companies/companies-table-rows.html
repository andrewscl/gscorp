<th:block th:fragment="rows">
    <tr th:each="company : ${companiesPage.content}">
        <td th:text="${company.name}"></td>
        <td th:text="${company.legalName}"></td>
        <td th:text="${company.taxId}"></td>
        <td th:text="${company.status.displayName}"></td>

        <td class="actions">
            <button type="button" class="btn btn-view"
                        th:attr="data-path=@{/private/companies/{externalId}(externalId=${company.externalId})}">
                Ver
            </button>

            <button type="button" class="btn btn-edit"
                        th:if="${#authorization.expression('hasRole(''ADMINISTRATOR'')')}"
                        th:attr="data-path=@{/admin/companies/{externalId}(externalId=${company.externalId})}">
                Editar
            </button>
        </td>
    </tr>
</th:block>
