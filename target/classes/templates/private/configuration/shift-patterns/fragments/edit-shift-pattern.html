<div class="view-shift-pattern">

    <input type="hidden" id="patrolExternalId"
                        th:value="${shiftPattern.externalId}" />

    <div class="hs-form-header">
      <h4>Editar Sistema de jornada</h4>
    </div>

    <div class="body">
      <div class="form-row w-custom">
        <div class="form-group fx-7">
          <label>Nombre del sistema:</label>
          <input id="shiftRequestName" type="text" th:value="${shiftPattern.name}" required>
        </div>
        <div class="form-group fx-3">
          <label>Código:</label>
          <input type="text" th:value="${shiftPattern.code}" required>
        </div>
      </div>

      <div class="form-group">
        <label>Descripción:</label>
        <input id="" type="text" th:value="${shiftPattern.description}">
      </div>

      <div class="form-row w-custom">
        <div class="form-group fx-5">
          <label>Días de trabajo:</label>
          <input type="number" th:text="${shiftPattern.workDays}" required>
        </div>
        <div class="form-group fx-5">
          <label>Días de descanso:</label>
          <input type="number" th:text="${shiftPattern.restDays}" required>
        </div>
      </div>
    </div>

    <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>

    <div th:replace="~{shared/fragments/footer-buttons ::
                          footer-buttons(
                                  true, 'Guardar',
                                  true, 'Volver',
                                  false, '')}">
    </div>

    <script type="module" src="/js/private/configuration/shift-patterns/edit-shift-pattern.js"></script>

</div>
