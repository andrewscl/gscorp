<div class="create-shift-pattern">

  <div class="hs-form-header">
    <h4>Crear sistema de jornada</h4>
  </div>

  <div class="body">

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="shiftPatternName" placeholder="Nombre del patrón" required/>
    </div>
    <div class="form-group">
      <label>Código</label>
      <input type="text" id="shiftPatternCode" placeholder="Ej: 4x2, 7x7"/>
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input type="text" id="shiftPatternDescription" placeholder="Descripción del patrón" required maxlength="255" />
    </div>

    <div class="form-row w-custom">
      <div class="form-group fx-5">
        <label>Días de trabajo</label>
        <input type="number" id="shiftPatternWorkDays" min="1" placeholder="Ej: 4" required />
      </div>
      <div class="form-group fx-5">
        <label>Días de descanso</label>
        <input type="number" id="shiftPatternRestDays" min="0" placeholder="Ej: 2" required />
      </div>
    </div>

  </div>

    <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>
    <div th:replace="~{shared/fragments/footer-buttons ::
                            footer-buttons(
                                true, 'Crear sistema de jornada',
                                true, 'Cancelar',
                                false, '')}"></div>

  <script type="module" src="/js/private/configuration/shift-patterns/create-shift-pattern.js"></script>

</div>
