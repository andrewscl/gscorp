<th:block th:fragment="rows">
        <tr th:each="sp : ${shiftPatterns}">
          <td th:text="${sp.name}"></td>
          <td th:text="${sp.code} ?: '—'">—</td>
          <td th:text="${sp.description}"></td>
          <td th:text="${sp.workDays}"></td>
          <td th:text="${sp.restDays}"></td>
          <td>
            <span class="tag"
                  th:text="${sp.active} ? 'Activo' : 'Inactivo'">Activo</span>
          </td>
          <td class="actions">
            <button type="button"
                    class="btn btn-link"
                    th:attr="data-path=@{/private/shift-patterns/show/{externalId}(externalId=${sp.externalId})}">
              Ver
            </button>
            <button type="button"
                    class="btn btn-link"
                    th:attr="data-path=@{/private/shift-patterns/edit/{externalId}(externalId=${sp.externalId})}">
              Editar
            </button>
          </td>
        </tr>
</th:block>
