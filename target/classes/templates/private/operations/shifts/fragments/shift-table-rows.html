      <th:block th:fragment="rows">
        <tr th:each="s : ${shifts}" th:data-id="${s.id}">
          <td th:text="${s.siteName != null ? s.siteName : '—'}">Nombre sitio</td>
          <td th:text="${s.shiftRequestCode}">TR001</td>
          <td th:text="${s.employeeFullName}">Leonardo Olivares</td>
          <td class="actions">
            <button type="button" class="btn btn-view"
                    th:attr="data-path=@{/private/shifts/view/{externalId}(externalId=${sa.externalId})}">
              Ver
            </button>
            <button type="button" class="btn btn-edit"
                    th:attr="data-path=@{/private/shifts/edit/{externalId}(externalId=${sa.externalId})}"
                    th:if="${#authorization.expression('hasRole(''ADMINISTRATOR'')')}">
              Editar
            </button>
          </td>
        </tr>

        <tr th:unless="${shifts != null and !shifts.isEmpty()}">
          <td colspan="100" style="text-align:center; padding: 1rem;">No hay datos disponibles</td>
        </tr>
        <tr>
            <td colspan="100" style="display: none !important; padding: 0; border: none;">
                <input type="hidden" id="sync-shift-request-count"
                  th:value="${count != null ? count : (shiftsPage != null ? shiftAssignmentsPage.totalElements : 0)}" />
            </td>
        </tr>

      </th:block>
