<div class="create-site-zone">
  <input type="hidden" id="siteExternalId"
                        th:value="${site.externalId}"/>

  <div class="hs-form-header">
    <h4>Crear nueva zona</h4>
  </div>

  <div class="body">
    <div class="form-group">
      <label>Instalación:</label>
        <span id="siteName" 
              th:text="${site.name ?: '-'}"></span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Nombre de la zona:</label>
        <input type="text" id="siteZoneName"/>
      </div>

      <div class="form-group">
        <label>Descripción:</label>
        <input type="text" id="siteZoneDescription"/>
      </div>
    </div>

  </div>

  <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>

  <div th:replace="~{shared/fragments/footer-buttons ::
                        footer-buttons(
                            true, 'Crear Zona',
                            true, 'Cancelar',
                            false, '')}"></div>

  <script type="module" src="/js/private/operations/site-zones/create-site-zone.js"></script>

</div>
