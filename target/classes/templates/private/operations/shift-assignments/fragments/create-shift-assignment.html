<div class="create-shift-assignment">
    <div class="panel-container">

        <div class="panel-main">
            <div class="panel-header">
                <h4>Crear asignación de turno</h4>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Proyecto:</label>
                    <select id="projectExternalId" required>
                        <option value="">Seleccione un proyecto</option>
                        <option th:each="project : ${projects}"
                                th:value="${project.externalId}"
                                th:text="${project.name}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sitio:</label>
                    <select id="siteExternalId" required disabled>
                        <option value="">Primero seleccione un proyecto</option>
                    </select>
                </div>

                <div class="form-row w-custom">
                    <div class="form-group fx-6">
                        <label>Turno:</label>
                        <select id="shiftRequestExternalId" required disabled>
                            <option value="">Primero seleccione un sitio</option>
                        </select>
                    </div>
                    <div class="form-group fx-4" id="shiftPatternGroup" style="display: none;">
                        <label>Jornada:</label>
                        <span id="shiftPattern"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Empleado a asignar:</label>
                    <select id="employeeExternalId" required disabled>
                        <option value="">Primero seleccione un turno</option>
                    </select>
                </div>

                <div class="form-row w-custom">
                    <div class="form-group fx-4">
                        <label>Inicio asignación:</label>
                        <input type="date" id="assignmentStartDate" required />
                    </div>
                    <div class="form-group fx-4">
                        <label>Fin asignación:</label>
                        <input type="date" id="assignmentEndDate"/>
                    </div>
                    <div class="form-group fx-2">
                        <label>Inicio ciclo:</label>
                        <select id="shiftPatternStartCycle" required disabled>
                            <option value=""></option>
                        </select>
                    </div>
                </div>

            </div>
        </div>

        <div class="panel-aside">
            <div class="panel-body">
                <div class="form-group">
                        <label>Notas / Observaciones:</label>
                        <textarea id="description"></textarea>
                </div>

                <div class="schedules-table">
                    <div class="title-row">
                        <div class="title-left">
                            <span class="title-text">Planificación proximos dias</span>
                        </div>
                    </div>
                    <!-- Si no hay shift assignments -->
                    <div class="shifts-list" 
                            th:if="${shifts == null or #lists.isEmpty(shifts)}">—</div>
                    <!-- Si hay assignments, mostramos una tabla -->
                    <div class="shift-assignments-list" 
                            th:if="${shifts != null and !#lists.isEmpty(shifts)}">
                        <table class="table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Dia</th>
                                <th>Inicio</th>
                                <th>Termino</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${shifts}">
                                <td th:text="${s.shiftDate != null ? s.shiftDate : ''}">18-05-2026</td>
                                <td th:text="${s.day != null ? s.day.displayNameInSpanish : ''}">Lunes</td>
                                <td th:text="${s.startTs != null ? #temporals.format(s.startTs, 'HH:mm') : '—'}">08:30</td>
                                <td th:text="${s.endTs != null ? #temporals.format(s.endTs, 'HH:mm') : '—'}">20:30</td>
                                <td th:text="${s.employeeName != null ? s.employeeName : '—'}">Employee</td>
                            </tr>
                        </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>
    <div th:replace="~{shared/fragments/footer-buttons ::
                            footer-buttons(
                                true, 'Asignar empleado',
                                true, 'Cancelar',
                                false, '')}"></div>

    <script type="module" src="/js/private/operations/shift-assignments/create-shift-assignment.js"></script>
</div>
