<th:block th:fragment="rows">
        <tr th:each="role : ${roles}">
          <td th:text="${role.name}"></td>
          <td th:text="${role.accountType.displayName}"></td>
          <td class="actions">
            <button type="button"
                    class="btn-link"
                    th:attr="data-path=@{/private/roles/show/{id}(id=${role.id})}">
              Ver
            </button>

            <button type="button"
                    class="btn-link"
                    th:attr="data-path=@{/private/roles/edit/{externalId}(externalId=${role.externalId})}">
              Editar
            </button>
          </td>
        </tr>
</th:block>
