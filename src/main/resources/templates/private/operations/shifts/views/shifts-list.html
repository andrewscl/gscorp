<div th:replace="~{shared/fragments/table-component :: smart-table(
    title='Turnos',
    count=${count},
    filters=~{::#shiftsFilters},
    actions=~{::#shiftsActions},
    thead=~{::#shiftsHeader},
    tbody=~{private/operations/shifts/fragments/shifts-list-rows :: rows},
    customClass='shifts-list'
)}">

    <th:block class="count" th:if="${shiftsCount != null}"
        th:text="${shiftsCount + ' registro' + (shiftsCount == 1 ? '' : 's')}"
        aria-live="polite" aria-atomic="true">
    </th:block>

    <th:block id="shiftsFilters">

        <label class="filter-item">
            <span class="filter-label">Desde</span>
            <input id="filter-from" class="filter-input" type="date" name="from"
                th:value="${from != null ? #temporals.format(from, 'yyyy-MM-dd') : (fromDate != null ? #temporals.format(fromDate, 'yyyy-MM-dd') : '')}" />
        </label>
        <label class="filter-item">
            <span class="filter-label">Hasta</span>
            <input id="filter-to" class="filter-input" type="date" name="to"
                th:value="${to != null ? #temporals.format(to, 'yyyy-MM-dd') : (toDate != null ? #temporals.format(toDate, 'yyyy-MM-dd') : '')}" />
        </label>

        <div class="filter-item">
            <span class="filter-label">Sitios</span>
            <select id="filter-dept" class="filter-input" name="siteId" required>
                <option value="">Todos los sitios</option>
                <option th:each="s : ${sites}"
                        th:value="${s.externalId}"
                        th:text="${s.name}"></option>
            </select>
        </div>

        <div class="filter-item item-action">
            <button class="btn btn-primary" id="searchshiftsBtn">
            Buscar
            </button>
        </div>
    </th:block>

    <th:block id="shiftsActions">
        <button class="btn btn-primary" id="addShiftsBtn"
            th:if="${#authorization.expression('hasRole(''ADMINISTRATOR'')')}">
            Crear registro
        </button>
    </th:block>

    <tr id="shiftsHeader">
        <th>Fecha</th>
        <th>Sitio</th>
        <th>Turno</th>
        <th>Horario</th>
        <th>Estado</th>
        <th>Empleado asignado</th>
        <th>Actions</th>
    </tr>
</div>

<div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>

<script type="module" src="/js/private/operations/shifts/shifts-list.js"></script>
