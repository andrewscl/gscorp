      <th:block th:fragment="rows">
        <tr th:each="sa : ${shiftAssignments}" th:data-id="${sa.id}">
          <td th:text="${sa.siteName != null ? sa.siteName : '—'}">Nombre sitio</td>
          <td th:text="${sa.shiftRequestCode}">TR001</td>
          <td>
            <div th:each="sch : ${sa.schedules}">
              <span th:text="${#temporals.dayOfWeekNameShort(sch.dayFrom)} + ' a ' + ${#temporals.dayOfWeekNameShort(sch.dayTo)}">Lunes a Viernes</span>
              <span th:text="' | '"></span>
              <span th:text="${#temporals.format(sch.startTime, 'HH:mm')} + ' - ' + ${#temporals.format(sch.endTime, 'HH:mm')}">09:00 - 17:00</span>
            </div>
          </td>
          <td class="actions">
            <button type="button" class="btn btn-view"
                    th:attr="data-path=@{/private/shift-requests/show/{externalId}(externalId=${sa.externalId})}">
              Ver
            </button>

            <button type="button" class="btn btn-edit"
                    th:attr="data-path=@{/private/shift-requests/edit/{externalId}(externalId=${sa.externalId})}"
                    th:if="${#authorization.expression('hasRole(''ADMINISTRATOR'')')}">
              Editar
            </button>
          </td>
        </tr>

        <tr th:unless="${shiftAssignments != null and !shiftAssignments.isEmpty()}">
          <td colspan="100" style="text-align:center; padding: 1rem;">No hay datos disponibles</td>
        </tr>
        <tr>
            <td colspan="100" style="display: none !important; padding: 0; border: none;">
                <input type="hidden" id="sync-shift-request-count"
                  th:value="${count != null ? count : (shiftAssignmentsPage != null ? shiftAssignmentsPage.totalElements : 0)}" />
            </td>
        </tr>

      </th:block>
