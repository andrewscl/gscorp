<div class="create-shift-request">
  <div class="panel-container">
    <div class="panel-main">
      <div class="panel-header">
        <h4>Crear Solicitud de Turno</h4>
      </div>
      <div class="panel-body">
          <div class="form-group">
            <label>Sitio:</label>
            <select id="shiftRequestSite" name="siteId" required>
              <option value="">Seleccione sitio</option>
              <option th:each="s : ${sites}"
                      th:value="${s.id}"
                      th:text="${s.name}"></option>
            </select>
          </div>
          <div class="form-group">
            <label>Zona:</label>
            <select id="siteZoneExternalId" required disabled>
               <option value="">Primero seleccione un proyecto</option>
            </select>
          </div>
          <div class="form-row w-custom">
            <div class="form-group fx-4">
              <label>Tipo de servicio</label>
              <select id="shiftRequestServiceType" name="type" required>
                <option value="">Seleccione tipo de servicio</option>
                <option th:each="t : ${requestTypes}"
                        th:value="${t.name()}"
                        th:text="${t.displayName}"></option>
              </select>
            </div>
            <div class="form-group fx-6">
              <label>Cuenta (opcional)</label>
              <select id="shiftRequestAccount" name="accountId">
                <option value="">Seleccione cuenta</option>
                <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.name}"></option>
              </select>
            </div>
          </div>
          <div class="form-row">
              <div class="form-group date-field input-with-icon">
                <label>Fecha inicio</label>
                <div class="input-icon-wrap">
                  <input class="input--date" type="date" id="shiftRequestStartDate" name="startDate" required aria-label="Fecha inicio" />
                  <button type="button" class="icon-btn calendar-btn" aria-label="Abrir calendario">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/>
                      <path d="M16 2v4M8 2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="form-group date-field input-with-icon">
                <label>Fecha término</label>
                <div class="input-icon-wrap">
                  <input class="input--date" type="date" id="shiftRequestEndDate" name="endDate" aria-label="Fecha término" />
                  <button type="button" class="icon-btn calendar-btn" aria-label="Abrir calendario">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.4" fill="none"/>
                      <path d="M16 2v4M8 2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
              </div>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <textarea id="shiftRequestDescription" name="description" placeholder="Descripción"></textarea>
          </div>
      </div>
    </div>
    <div class="panel-aside">
        <div class="panel schedules-panel">
          <div class="panel-header">
            <label>Horarios por tramos de días</label>
            <button type="button" id="addDayRange" class="btn-mini">+ Añadir tramo</button>
          </div>
          <div id="shiftDayRanges" class="shift-dayranges-list">
          </div>
          <small class="dayrange-help">
            Ej: Lun a Mié 08:00-18:00, Jue a Vie 09:00-17:00, Sáb a Dom 10:00-14:00, etc.
          </small>
        </div>
    </div>
  </div>

  <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>
  <div th:replace="~{shared/fragments/footer-buttons ::
                            footer-buttons(
                                true, 'Crear solicitud',
                                true, 'Cancelar',
                                false, '')}"></div>

  <script type="module" src="/js/private/shift-requests/create-shift-request.js"></script>

</div>
