<div id="editProjectContainer" class="edit-project-container">

  <div class="panel-container">
    <div class="panel-main">

      <div class="panel-header">
        <h4>Editar Proyecto</h4>
      </div>

      <div class="panel-body">
        <div class="form-group">
          <label>Cliente</label>
          <span class="readonly-field"
            th:text="${project.clientName != null ? project.clientName : '—'}"></span>
          <small>Un proyecto pertenece a un único cliente.</small>
        </div>

        <hr class="form-separator"/>

        <div class="form-group">
          <label>Nombre</label>
          <input id="projectName" type="text"
                th:value="${project.name}" required />
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <input id="projectDescription" type="text"
                th:value="${project.description}" placeholder="Descripción del proyecto"/>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Fecha inicio</label>
            <input id="projectStartDate" type="date"
                  th:value="${project.startDate}" required/>
          </div>
          <div class="form-group">
            <label>Fecha término</label>
            <input id="projectEndDate" type="date"
                  th:value="${project.endDate}"/>
          </div>
        </div>

        <div class="form-group active-row">
          <input id="projectActive" type="checkbox"
                th:checked="${project.active}"/>
          <label style="margin:0">Activo</label>
        </div>
      </div>
    </div>

    <div class="panel-aside"></div>
  </div>

  <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>
  <div th:replace="~{shared/fragments/footer-buttons :: footer-buttons(
                                                            true, 'Guardar',
                                                            true, 'Cancelar',
                                                            false, ''
                                                            )}"></div>


  <script type="module" src="/js/private/admin/projects/edit-project.js"></script>

</div>
