<th:block th:fragment="rows">

        <tr th:each="p : ${projects}">
          <td th:text="${p.name}"></td>
          <td th:text="${p.clientName}">—</td>
          <td th:text="${p.startDate}">—</td>
          <td th:text="${p.endDate}">—</td>
          <td th:text="${p.status}">—</td>
          <td class="actions">
            <button type="button"
                    class="btn btn-view"
                    th:attr="data-path=@{/private/projects/show/{id}(id=${p.id})}">
              Ver
            </button>
            <button type="button"
                    class="btn btn-edit"
                    th:attr="data-path=@{/private/projects/edit/{id}(id=${p.id})}"
                    th:if="${#authorization.expression('hasRole(''ADMINISTRATOR'')')}">
              Editar
            </button>
          </td>
        </tr>

</th:block>
