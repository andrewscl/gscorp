<div class="forgot-password-container">

        <div class="auth-form-container">

            <button type="button" class="close-button" id="cancelRecovery"
                                aria-label="Cancelar y volver al inicio de sesión">
                <span aria-hidden="true">&times;</span>
            </button>

            <div id="logo-container" class="logo-container">
                <img id="logo" class="logo" th:src="@{/img/logo-mail.png}"
                                                            alt="Logo" />
            </div>

            <div class="auth-form-title">
                <h2 class="auth-form-title-text">Recuperar Contraseña</h2>
                <p>Ingresar tu usuario o correo y
                    te enviaremos un mensaje para que recuperes tu contraseña</p>
            </div>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label >Nombre de Usuario o Correo Electrónico:</label>
                    <input type="text" id="username" name="username" 
                            placeholder="Tu nombre de usuario" 
                                class="form-control" required autofocus />
                </div>

                <button type="button" id="forgotPasswordBtn" class="btn btn-primary">Enviar enlace</button>
            </form>

        </div>

</div>
