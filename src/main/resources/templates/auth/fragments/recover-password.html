<div class="recover-password-container">
    <div class="auth-form-container">

        <div id="logo-container" class="logo-container">
            <img id="logo" class="logo" th:src="@{/img/logo-mail.png}"
                                                            alt="Logo" />
        </div>

        <input type="hidden" id="token" name="token" th:value="${token}" />

        <div class="auth-form-title">
                <h1 class="auth-form-title-text">Restablecer Contraseña</h1>
        </div>

        <div id="signinForm" class="auth-form">
            <div class="form-group">
                <label for="newPassword">Nueva contraseña:</label>
                <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword"
                                    placeholder="Tu contraseña" class="form-control"
                                        required />
                        <button type="button" id="togglePassword" class="togglePassword">Mostrar</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña:</label>
                <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                                    placeholder="Tu contraseña" class="form-control"
                                        required />
                        <button type="button" id="toggleConfirmPassword" class="togglePassword">Mostrar</button>
                </div>
            </div>

            <button type="button" id="definePasswordBtn" class="btn btn-primary">Definir contraseña</button>
        </div>

        <div th:replace="~{shared/fragments/form-alerts :: form-alerts}"></div>

    </div>

    <script type="module" src="/js/auth/recover-password.js"></script>
</div>
